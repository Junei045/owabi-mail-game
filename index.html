<style>
/* お詫びメール見分けゲーム
owabi-check（お詫びメール見分けチェック）と同じ配色・文字サイズで作っています。
外部のフォントや画像は読み込まず、このファイル1つで動きます。 */
:root{
color-scheme:light;
--bg:#EEF2F2; --surface:#FFFFFF; --ink:#18262D; --muted:#3F5058; --line:#BFCBCE;
--accent:#0D6670; --accent-ink:#FFFFFF; --accent-soft:#DDEEEF;
--danger:#B1231B; --danger-bg:#FCE8E6;
--warn:#7D5200; --warn-bg:#FFF1CF;
--info:#1C557F; --info-bg:#E3EEF6;
--mailbtn:#1F5FAE; --mailbtn-ink:#FFFFFF;
--f-display:"Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic",sans-serif;
--f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
--base:20px;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#10181B; --surface:#192328; --ink:#EEF3F4; --muted:#B7C4C8; --line:#34434A;
--accent:#5EC3CB; --accent-ink:#08191C; --accent-soft:#183238;
--danger:#FF8C82; --danger-bg:#3A1613;
--warn:#F1C25A; --warn-bg:#33260A;
--info:#8DC4EC; --info-bg:#132838;
--mailbtn:#6FA6E6; --mailbtn-ink:#08121C;
color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#10181B; --surface:#192328; --ink:#EEF3F4; --muted:#B7C4C8; --line:#34434A;
--accent:#5EC3CB; --accent-ink:#08191C; --accent-soft:#183238;
--danger:#FF8C82; --danger-bg:#3A1613;
--warn:#F1C25A; --warn-bg:#33260A;
--info:#8DC4EC; --info-bg:#132838;
--mailbtn:#6FA6E6; --mailbtn-ink:#08121C;
color-scheme:dark;
}
html.big{ --base:24px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.75;}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:1.6em;font-weight:900}
h2{font-size:1.3em}
h3{font-size:1.1em}
p{margin:0}
[hidden]{display:none!important}

.top{display:flex;flex-direction:column;gap:8px}
.top .lead{color:var(--muted)}
.size{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85em;color:var(--muted)}
.size button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.size button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.rule{background:var(--danger-bg);border:3px solid var(--danger);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.rule strong{color:var(--danger);font-family:var(--f-display);font-size:1.15em}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.progress{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-family:var(--f-display);font-size:1.3em;font-weight:700;line-height:1.55}
.hint{color:var(--muted);font-size:.9em}
.answers{display:flex;flex-direction:column;gap:12px}
.answers button{font:inherit;font-weight:700;font-size:1.15em;min-height:68px;border-radius:14px;cursor:pointer;border:3px solid var(--accent);background:var(--surface);color:var(--ink);padding:10px 14px}
.answers button:disabled{opacity:.55;cursor:default}
/* 回答後の印。正解の選択肢と、自分が選んだ選択肢は薄くせずに残す。
   色だけに頼らず、ボタンの上に「○ 正解」などの文字も付ける。 */
.answers button.is-correct:disabled{opacity:1;border-color:var(--info);background:var(--info-bg)}
.answers button.is-wrong:disabled{opacity:1;border-color:var(--danger);background:var(--danger-bg)}
.answers .mark{display:block;font-size:.75em;line-height:1.4;margin-bottom:2px}
.answers .is-correct .mark{color:var(--info)}
.answers .is-wrong .mark{color:var(--danger)}
.bigbtn{font:inherit;font-weight:700;font-size:1.15em;min-height:68px;border-radius:14px;cursor:pointer;border:3px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px}
.restart{font:inherit;font-weight:700;min-height:60px;border-radius:14px;border:3px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer;padding:8px 16px}

.verdict{border-radius:14px;padding:18px;border:3px solid;display:flex;flex-direction:column;gap:8px}
.verdict.red{background:var(--danger-bg);border-color:var(--danger)}
.verdict.red h2{color:var(--danger)}
.verdict.amber{background:var(--warn-bg);border-color:var(--warn)}
.verdict.amber h2{color:var(--warn)}
.verdict.blue{background:var(--info-bg);border-color:var(--info)}
.verdict.blue h2{color:var(--info)}
.steps{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:10px}
.steps li::marker{font-weight:700;color:var(--accent)}

.mail{border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.mail .subj{font-weight:700;font-family:var(--f-display);font-size:1.05em}
.mail .from{font-size:.85em;color:var(--muted)}

/* メールの中の「ボタン」の見本。
   見た目は本物のメールのボタンに似せていますが、押しても・触っても何も起きません。
   ・pointer-events:none で、クリックもホバーも受け付けない
   ・ボタン要素ではなく span なので、Tabキーでも選ばれない
   ・文字選択や長押しメニューも出ないようにしている */
.mail .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;cursor:default}
.mail .fakebtn{display:inline-block;background:var(--mailbtn);color:var(--mailbtn-ink);font-weight:700;font-size:1em;line-height:1.4;padding:12px 24px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.2);pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mail .btnnote{font-size:.75em;color:var(--muted)}

.tag{display:inline-block;font-size:.8em;font-weight:700;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:2px 12px;align-self:flex-start}
.fb{border-radius:12px;padding:14px 16px;border:3px solid;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--info-bg);border-color:var(--info)}
.fb.ng{background:var(--danger-bg);border-color:var(--danger)}
.note{font-size:.85em;color:var(--muted)}

.axis{display:flex;flex-direction:column;gap:6px}
.axis .ahead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.axis .aname{font-weight:700}
.axis .acount{font-family:var(--f-display);font-size:1.3em;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pillars{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:12px}
.pillars li::marker{font-weight:700;color:var(--accent)}
footer{font-size:.8em;color:var(--muted);text-align:center}

:focus-visible{outline:4px solid var(--warn);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>

<script>
(function(){
"use strict";

function el(tag,cls,html){
var e=document.createElement(tag);
if(cls) e.className=cls;
if(html!=null) e.innerHTML=html;
return e;
}
function esc(s){
return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
}
/* 配列をランダムに並べ替えたコピーを返す（Fisher–Yates法）。元の配列は変えない。 */
function shuffled(arr){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1));
var t=a[i]; a[i]=a[j]; a[j]=t;
}
return a;
}

var app=document.getElementById('app');
var root=document.documentElement;

/* ---------- 画面の骨組み ---------- */
var header=el('header','top');
header.appendChild(el('h1',null,'お詫びメール見分けゲーム'));
header.appendChild(el('p','lead','「個人情報が流出しました」というお詫びメール。本物をまねた<b>にせメール</b>も届いています。メールが届いたつもりで読んで、「どうするのが安全か」を選ぶ練習ゲームです。'));
var sizeBox=el('div','size'); sizeBox.setAttribute('role','group'); sizeBox.setAttribute('aria-label','文字の大きさ');
sizeBox.appendChild(el('span',null,'文字の大きさ'));
var szN=el('button',null,'ふつう'); szN.type='button'; szN.setAttribute('aria-pressed','true');
var szB=el('button',null,'大きく'); szB.type='button'; szB.setAttribute('aria-pressed','false');
sizeBox.appendChild(szN); sizeBox.appendChild(szB);
header.appendChild(sizeBox);
app.appendChild(header);

var rule=el('div','rule');
rule.appendChild(el('strong',null,'まず、これだけは守りましょう'));
rule.appendChild(el('p',null,'メールの中のボタンやリンクは<b>押さない</b>。メールに書かれた電話番号にも<b>かけない</b>。'));
app.appendChild(rule);

var scrTitle=el('section','panel'); app.appendChild(scrTitle);
var scrGame=el('section','panel'); scrGame.hidden=true; app.appendChild(scrGame);
var scrResult=el('section','panel'); scrResult.hidden=true; app.appendChild(scrResult);

var footer=el('footer',null,'このゲームは訓練用です。本物のメールかどうか迷ったら、メールのリンクを使わず、自分で開いた公式ホームページや公式アプリで確認してください。');
app.appendChild(footer);

/* ---------- 文字サイズ（owabi-checkと同じ操作） ---------- */
function setSize(big){
root.classList.toggle('big',big);
szN.setAttribute('aria-pressed',String(!big)); szB.setAttribute('aria-pressed',String(big));
try{localStorage.setItem('owabi-big',big?'1':'0')}catch(e){}
}
try{ if(localStorage.getItem('owabi-big')==='1') setSize(true);}catch(e){}
szN.onclick=function(){setSize(false);};
szB.onclick=function(){setSize(true);};

/* ============================================================
事例データ
事例を増やすときは、この配列に1要素を足すだけです。
件数表示（全○件）・進行表示・採点の集計は、配列の長さに
自動で追従します。

buttons は、メールの中に表示する「ボタン」の文字です。
ボタンが2つあるメールは、2つ書きます。
（見た目だけのボタンで、押しても何も起きません）

choices は、画面に出すときに毎回ランダムに並べ替えます。
ここでの並び順は気にせず書いて大丈夫です。

choices の ax は、採点3軸の内訳です。左から
[0] 危険に気づけたか
[1] リンクを踏まずに止まれたか
[2] 安全な次の行動を選べたか
正解の選択肢は3つとも true。不正解でも、リンクを押さずに
立ち止まった選択肢（返信して聞く／メールの中の番号にかける等）は
[0][1] だけ true にし、危ない行動（リンク先で入力する等）は
すべて false にしています。
============================================================ */

choices:[
{t:'ボタンからログインして、パスワードを再設定する', ok:false, ax:[false,false,false], fb:'メールの中のボタンからログインさせるのは、パスワードを盗むための手口です。「24時間以内」と急がせるのも、決まったやり方です。'},
{t:'ボタンは押さず、公式アプリを自分で開いて確かめる', ok:true, ax:[true,true,true], fb:'その通りです。再設定が必要かどうかは、メールの中からではなく、自分で開いた公式の場所で確かめます。'},

/* ---------- 状態 ---------- */
var idx=0, correct=0, axes=[0,0,0];
var AXIS_NAMES=['危険に気づけたか','リンクを踏まずに止まれたか','安全な次の行動を選べたか'];

function showScreen(which){
scrTitle.hidden = which!=='title';
scrGame.hidden = which!=='game';
scrResult.hidden= which!=='result';
window.scrollTo(0,0);
}

/* ---------- タイトル画面 ---------- */
function renderTitle(){
scrTitle.innerHTML='';
scrTitle.appendChild(el('h2',null,'にせメールを見分ける練習をしましょう'));
scrTitle.appendChild(el('p',null,'今日、あなたのメールボックスに <b>'+CASES.length+'件</b> のメールが届きました。その中には、情報流出のお詫びに便乗する「にせメール」がまぎれています。1件ずつ読んで、どうするのが安全かを選んでください。'));
var disc=el('div','fb ng');
disc.appendChild(el('h3',null,'これは訓練用のゲームです'));
disc.appendChild(el('p',null,'ここに出てくるメールは、すべて<b>訓練用の想定パターン</b>です。実際に確認された詐欺メールではありません。実在の情報流出の発表をもとに、便乗する手口を再現したものです。メールの中のボタンは見た目だけの見本で、押しても何も起きません。'));
scrTitle.appendChild(disc);
var start=el('button','bigbtn','ゲームをはじめる'); start.type='button';
start.onclick=function(){ idx=0; correct=0; axes=[0,0,0]; renderCase(); showScreen('game');};
scrTitle.appendChild(start);
}

/* ---------- 事例画面 ---------- */
function renderCase(){
var c=CASES[idx];
scrGame.innerHTML='';
var pr=el('div','progress');
pr.appendChild(el('span',null,'事例 '+(idx+1)+' 件目 ／ 全'+CASES.length+'件'));
var bar=el('div','bar'); var fill=el('i'); fill.style.width=(idx/CASES.length*100)+'%'; bar.appendChild(fill); pr.appendChild(bar);
scrGame.appendChild(pr);
scrGame.appendChild(el('span','tag',esc(c.tag)+'（訓練用）'));
/* 事例の説明（note）は、答えを選んだあとのフィードバック欄に出す（先に見えるとネタばらしになるため） */
var mail=el('div','mail');
mail.appendChild(el('p','subj',esc(c.subj)));
mail.appendChild(el('p','from','送り主：'+esc(c.from)));
var bd=el('p'); bd.innerHTML=esc(c.body).replace(/\n/g,'<br>'); mail.appendChild(bd);

/* メールの中のボタン（見た目だけ。押しても何も起きない） */
var row=el('div','btnrow');
(c.buttons||[]).forEach(function(label){
var fb=el('span','fakebtn');
fb.textContent=label;
fb.setAttribute('role','img');
fb.setAttribute('aria-label','メールの中のボタンの見本：'+label+'（押せません）');
row.appendChild(fb);
});
mail.appendChild(row);
mail.appendChild(el('p','btnnote','※ 上のボタンは訓練用の見本です。押しても何も起きません。'));
scrGame.appendChild(mail);

scrGame.appendChild(el('p','q','このメールが届いたら、どうするのが安全ですか？'));
var box=el('div','answers'); box.setAttribute('role','group'); box.setAttribute('aria-label','答えの選択肢');
/* 答えの並びは毎回ランダム（正解の位置を覚えて当てられないように） */
shuffled(c.choices).forEach(function(ch){
var b=el('button'); b.type='button'; b.textContent=ch.t;
b._choice=ch; /* 回答後に「どれが正解か」を示すため、選択肢のデータを覚えさせておく */
b.onclick=function(){ answerCase(ch,box);};
box.appendChild(b);
});
scrGame.appendChild(box);
var fbSlot=el('div'); fbSlot.id='case-fb'; fbSlot.setAttribute('aria-live','polite'); scrGame.appendChild(fbSlot);
}

function answerCase(ch,box){
var btns=box.querySelectorAll('button');
for(var i=0;i<btns.length;i++){
var b=btns[i], bc=b._choice, picked=(bc===ch), mark=null;
b.disabled=true;
/* 正解の選択肢と、自分が選んだ選択肢に印を付ける */
if(bc.ok){ b.classList.add('is-correct'); mark=picked?'○ あなたの選択（正解）':'○ 正解はこちら'; }
else if(picked){ b.classList.add('is-wrong'); mark='× あなたの選択'; }
if(mark){ b.innerHTML='<span class="mark">'+mark+'</span>'+esc(bc.t); }
}
if(ch.ok) correct++;
for(var a=0;a<3;a++) if(ch.ax[a]) axes[a]++;
var slot=document.getElementById('case-fb');
var fb=el('div','fb '+(ch.ok?'ok':'ng'));
fb.appendChild(el('h3',null,ch.ok?'○ 安全な行動です':'× それは危ない行動です'));
fb.appendChild(el('p',null,esc(ch.fb)));
var c=CASES[idx];
fb.appendChild(el('p',null,'<b>手口のポイント：</b>'+esc(c.point)));
if(c.note) fb.appendChild(el('p','note','<b>この事例について：</b>'+esc(c.note)));
slot.appendChild(fb);
var last=(idx===CASES.length-1);
var nx=el('button','restart',last?'結果を見る':'次の事例へ'); nx.type='button';
nx.onclick=function(){
if(last){ renderResult(); showScreen('result');}
else { idx++; renderCase(); scrGame.scrollIntoView({block:'start'});}
};
slot.appendChild(nx);
slot.scrollIntoView({block:'nearest'});
}

/* ---------- まとめ画面 ---------- */
function renderResult(){
scrResult.innerHTML='';
var n=CASES.length, v;
if(correct===n){
v=el('div','verdict blue');
v.appendChild(el('h2',null,n+'問とも、安全な行動が選べました'));
v.appendChild(el('p',null,'本物の便乗メールが来ても、この調子なら大丈夫です。家族にも教えてあげてください。'));
}else if(correct===n-1){
v=el('div','verdict amber');
v.appendChild(el('h2',null,n+'問中 '+(n-1)+'問、正解です'));
v.appendChild(el('p',null,'あと少しです。下の3つの約束を覚えておきましょう。'));
}else{
v=el('div','verdict red');
v.appendChild(el('h2',null,n+'問中 '+correct+'問、正解です'));
v.appendChild(el('p',null,'便乗メールは、本物そっくりに作られています。下の3つの約束を覚えて、もう一度練習してみましょう。'));
}
scrResult.appendChild(v);

scrResult.appendChild(el('h3',null,'あなたの結果（3つの力）'));
for(var a=0;a<3;a++){
var ax=el('div','axis');
var head=el('div','ahead');
head.appendChild(el('span','aname',(a+1)+'. '+AXIS_NAMES[a]));
head.appendChild(el('span','acount',axes[a]+' ／ '+n+'件'));
ax.appendChild(head);
var bar=el('div','bar'); var fill=el('i'); fill.style.width=(n?axes[a]/n*100:0)+'%'; bar.appendChild(fill); ax.appendChild(bar);
scrResult.appendChild(ax);
}
scrResult.appendChild(el('p','note','リンクは踏まなかったけれど、安全ではない行動（返信する、メールの中の番号にかけるなど）を選んだ場合は、「気づけたか」と「止まれたか」だけ数えています。'));

scrResult.appendChild(el('h3',null,'覚えておきたい3つのこと'));
var pil=el('ol','pillars');
[
'<b>本当の内容が書かれていても、本物の証拠にならない</b> ― 漏れた本当の情報を使って、本物らしく作られていることがあるからです。',
'<b>メールや電話でカード情報を聞いてくること自体が、手がかりになる</b> ― 「何が漏れたか」の発表と、メールが求めてくる情報を比べてみましょう。',
'<b>「調べる・確認する」行為自体が、入口になることがある</b> ― 確かめるときは、通知のリンクからではなく、自分で開いた公式の場所で確かめます。'
].forEach(function(t){ pil.appendChild(el('li',null,t));});
scrResult.appendChild(pil);

scrResult.appendChild(el('h3',null,'便乗メールへの3つの約束'));
var ol=el('ol','steps');
['メールの中のリンクやボタンは押さない。返信もしない。',
'手続きや確認は、自分で開いた公式ホームページや公式アプリから行う。',
'問い合わせは、カードの裏や請求書など、いつもの電話番号で。メールの中の番号は使わない。'
].forEach(function(t){ ol.appendChild(el('li',null,t));});
scrResult.appendChild(ol);

var again=el('button','restart','もう一度遊ぶ'); again.type='button';
again.onclick=function(){ idx=0; correct=0; axes=[0,0,0]; renderCase(); showScreen('game');};
scrResult.appendChild(again);
}

renderTitle();
})();
</script>
</body>
</html>
